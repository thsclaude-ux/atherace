<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ترتيب المتسابقين</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <h1>ترتيب المتسابقين</h1>
      <nav class="header-actions">
        <a href="/" class="btn btn-ghost">الترشيحات</a>
        <a href="/admin.html" class="btn btn-ghost">دخول المسؤول</a>
      </nav>
    </div>
  </header>

  <main class="container main">
    <p id="demo-banner" class="demo-banner hidden" role="status">وضع الاختبار — النتائج المعروضة تجريبية</p>
    <section class="card">
      <header class="panel-header">
        <h2>الجدول النهائي</h2>
        <div class="panel-actions">
          <a href="/print-results.html" class="btn btn-ghost btn-sm" target="_blank" rel="noopener">طباعة النتائج</a>
        </div>
        <p id="last-updated" class="hint" aria-live="polite"></p>
      </header>

      <p id="ranking-error" class="form-message error hidden" role="alert"></p>

      <section class="table-wrap">
        <table class="data-table" id="ranking-table">
          <thead>
            <tr>
              <th scope="col">الترتيب</th>
              <th scope="col">الاسم</th>
              <th scope="col">النقاط</th>
            </tr>
          </thead>
          <tbody id="ranking-body">
            <tr>
              <td colspan="3" class="hint">جاري التحميل…</td>
            </tr>
          </tbody>
        </table>
      </section>
    </section>
  </main>

  <script type="module" src="/js/ranking.js"></script>
</body>
</html>
