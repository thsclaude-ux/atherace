[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # متغيرات: FIREBASE_* , FIREBASE_WEB_* , ALLOWED_ORIGIN , SENTRY_DSN , APP_ENV

# سياقات Netlify — عيّن المتغيرات الحساسة في لوحة Netlify لكل نطاق (Production / Branch deploys)
[context.production.environment]
  APP_ENV = "production"

[context.deploy-preview.environment]
  APP_ENV = "preview"

[context.branch-deploy.environment]
  APP_ENV = "staging"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
