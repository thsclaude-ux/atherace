name: AT THE RACE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@atr/shared

      - name: Build API
        run: npm run build --workspace=@atr/api

      - name: Build Web
        run: npm run build --workspace=@atr/web

      - name: Run tests
        run: npm test --workspace=@atr/api

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t at-the-race-api .
          docker build -t at-the-race-web -f Dockerfile.web .
